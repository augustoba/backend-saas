spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # Los tests usan H2 en memoria con el esquema de las entidades: los scripts
  # de Flyway son SQL de MySQL.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: true

app:
  jwt:
    secret: test-secret-estilos-pequenos-1234567890-abcdefghij
    expiration-minutes: 60
  admin:
    dni: "11111111"
    password: test-pass
  cors:
    allowed-origins: http://localhost:4200
  seed:
    enabled: true
